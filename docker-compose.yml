services:
  db:
    image: cgr.dev/chainguard/postgres:latest
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    profiles:
      - production
  web:
    build: .
    command: "bundle exec puma"
    volumes:
      - .:/usr/src/app
    ports:
      - "3000:3000"
    depends_on:
      - db
    profiles:
      - production
  dev:
    build: .
    command: "bundle exec puma"
    volumes:
      - .:/usr/src/app
    ports:
      - "3000:3000"
